    material: Tears inside a gem worth at least 300 gp.
    range: 90 feet
    concentration: true
  - name: Summon Undead
    level: 3
    school: Necromancy
    casting_time: 1 action
    duration: Up to 1 hour
    components: V, S, M
    desc: >-
      You call forth an undead spirit. It manifests in an unoccupied space that you can see within range. This corporeal
      form uses the Undead Spirit stat block. When you cast the spell, choose the creature's form: Ghostly, Putrid, or
      Skeletal. The spirit resembles an undead creature with the chosen form, which determines certain traits in its
      stat block. The creature disappears when it drops to 0 hit points or when the spell ends.


      The creature is an ally to you and your companions. In combat, the creature shares your initiative count, but it
      takes its turn immediately after yours. It obeys your verbal commands (no action required by you). If you don't
