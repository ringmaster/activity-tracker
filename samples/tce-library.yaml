    higher_level: >-
      When you cast this spell using a spell slot of 4th level or higher, use the higher level wherever the spell's
      level appears in the stat block.
    material: An ornate stone and metal lockbox worth at least 400 gp.
    range: 90 feet
    concentration: true
  - name: Summon Elemental
    level: 4
    school: Conjuration
    casting_time: 1 action
    duration: Up to 1 hour
    components: V, S, M
    desc: >-
      You call forth an elemental spirit. It manifests in an unoccupied space that you can see within range. This
