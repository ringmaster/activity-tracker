    material: Humanoid blood inside a ruby vial worth at least 600 gp.
    range: 90 feet
    concentration: true
  - name: Summon Shadowspawn
    level: 3
    school: Conjuration
    casting_time: 1 action
    duration: Up to 1 hour
    components: V, S, M
    desc: >-
      You call forth a shadowy spirit. It manifests in an unoccupied space that you can see within range. This corporeal
