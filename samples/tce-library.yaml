    material: A gilded flower worth at least 300 gp.
    range: 90 feet
    concentration: true
  - name: Summon Fiend
    level: 6
    school: Conjuration
    casting_time: 1 action
    duration: Up to 1 hour
    components: V, S, M
    desc: >-
      You call forth a fiendish spirit. It manifests in an unoccupied space that you can see within range. This
      corporeal form uses the Fiendish Spirit stat block. When you cast the spell, choose Demon, Devil, or Yugoloth. The
