spells:
  - name: Blade of Disaster
    level: 9
    school: Conjuration
    casting_time: 1 bonus action
    duration: Up to 1 minute
    components: V, S
    desc: >-
      You create a blade-shaped planar rift about 3 feet long in an unoccupied space you can see within range. The blade
      lasts for the duration. When you cast this spell, you can make up to two melee spell attacks with the blade, each
      one against a creature, loose object, or structure within 5 feet of the blade. On a hit, the target takes 4d12
      force damage. This attack scores a critical hit if the number on the d20 is 18 or higher. On a critical hit, the
      blade deals an extra 8d12 force damage (for a total of 12d12 force damage).


      As a bonus action on your turn, you can move the blade up to 30 feet to an unoccupied space you can see and then
      make up to two melee spell attacks with it again.


      The blade can harmlessly pass through any barrier, including a wall of force.
    range: 60 feet
    concentration: true
    damageType: force
    dice: 4d12
  - name: Booming Blade
    level: 0
    school: Evocation
    casting_time: 1 action
    duration: 1 round
    components: S, M
    desc: >-
      You brandish the weapon used in the spell's casting and make a melee attack with it against one creature within 5
      feet of you. On a hit, the target suffers the weapon attack's normal effects and then becomes sheathed in booming
      energy until the start of your next turn. If the target willingly moves 5 feet or more before then, the target
      takes 1d8 thunder damage, and the spell ends.


      This spell's damage increases when you reach certain levels. At 5th level, the melee attack deals an extra 1d8
      thunder damage to the target on a hit, and the damage the target takes for moving increases to 2d8. Both damage
      rolls increase by 1d8 at 11th level (2d8 and 3d8) and again at 17th level (3d8 and 4d8).
    material: A melee weapon worth at least 1 sp.
    range: Self (5-foot radius)
    areaOfEffect: 5ft sphere
    damageType: thunder
    dice: 1d8
  - name: Dream of the Blue Veil
    level: 7
    school: Conjuration
    casting_time: 10 minutes
    duration: 6 hours
    components: V, S, M
    desc: >-
      You and up to eight willing creatures within range fall unconscious for the spell's duration and experience
      visions of another world on the Material Plane, such as Oerth, Toril, Krynn, or Eberron. If the spell reaches its
      full duration, the visions conclude with each of you encountering and pulling back a mysterious blue curtain. The
      spell then ends with you mentally and physically transported to the world that was in the visions.


      To cast this spell, you must have a magic item that originated on the world you wish to reach, and you must be
      aware of the world's existence, even if you don't know the world's name. Your destination in the other world is a
      safe location within 1 mile of where the magic item was created. Alternatively, you can cast the spell if one of
      the affected creatures was born on the other world, which causes your destination to be a safe location within 1
      mile of where that creature was born.


      The spell ends early on a creature if that creature takes any damage, and the creature isn't transported. If you
      take any damage, the spell ends for you and all the other creatures, with none of you being transported.
    material: A magic item or a willing creature from the destination world.
    range: 20 feet
  - name: Green-Flame Blade
    level: 0
    school: Evocation
    casting_time: 1 action
    duration: Instantaneous
    components: S, M
    desc: >-
      You brandish the weapon used in the spell's casting and make a melee attack with it against one creature within 5
      feet of you. On a hit, the target suffers the weapon attack's normal effects, and you can cause green fire to leap
      from the target to a different creature of your choice that you can see within 5 feet of it. The second creature
      takes fire damage equal to your spellcasting ability modifier.


      This spell's damage increases when you reach certain levels. At 5th level, the melee attack deals an extra 1d8
      fire damage to the target on a hit, and the fire damage to the second creature increases to 1d8 + your
      spellcasting ability modifier. Both damage rolls increase by 1d8 at 11th level (2d8 and 2d8) and 17th level (3d8
      and 3d8).
    material: A melee weapon worth at least 1 sp.
    range: Self (5-foot radius)
    areaOfEffect: 5ft sphere
    damageType: fire
    dice: 1d8
  - name: Intellect Fortress
    level: 3
    school: Abjuration
    casting_time: 1 action
    duration: Up to 1 hour
    components: V
    desc: >-
      For the duration, you or one willing creature you can see within range has resistance to psychic damage, as well
      as advantage on Intelligence, Wisdom, and charisma saving throws.
    higher_level: >-
      When you cast this spell using a spell slot of 4th level or higher, you can target one additional creature for
      each slot level above 3rd. The creatures must be within 30 feet of each other when you target them.
    range: 30 feet
    concentration: true
  - name: Lightning Lure
    level: 0
    school: Evocation
    casting_time: 1 action
    duration: Instantaneous
    components: V
    desc: >-
      You create a lash of lightning energy that strikes at one creature of your choice that you can see within 15 feet
      of you. The target must succeed on a strength saving throw or be pulled up to 10 feet in a straight line toward
      you and then take 1d8 lightning damage if it is within 5 feet of you.


      This spell's damage increases by 1d8 when you reach 5th level (2d8), 11th level (3d8), and 17th level (4d8).
    range: Self (15-foot radius)
    areaOfEffect: 15ft sphere
    damageType: lightning
    dice: 1d8
    saveStat: str
    saveOnSuccess: none
  - name: Mind Sliver
    level: 0
    school: Enchantment
    casting_time: 1 action
    duration: 1 round
    components: V
    desc: >-
      You drive a disorienting spike of psychic energy into the mind of one creature you can see within range. The
      target must succeed on an intelligence saving throw or take 1d6 psychic damage and subtract 1d4 from the next
      saving throw it makes before the end of your next turn.


      This spell's damage increases by 1d6 when you reach certain levels: 5th level (2d6), 11th level (3d6), and 17th
      level (4d6).
    range: 60 feet
    damageType: psychic
    dice: 1d6
    saveStat: int
    saveOnSuccess: none
  - name: Spirit Shroud
    level: 3
    school: Necromancy
    casting_time: 1 bonus action
    duration: Up to 1 minute
    components: V, S
    desc: >-
      You call forth spirits of the dead, which flit around you for the spell's duration. The spirits are intangible and
      invulnerable.


      Until the spell ends, any attack you make deals 1d8 extra damage when you hit a creature within 10 feet of you.
      This damage is radiant, necrotic, or cold (your choice when you cast the spell). Any creature that takes this
      damage can't regain hit points until the start of your next turn.


      In addition, any creature of your choice that you can see that starts its turn within 10 feet of you has its speed
      reduced by 10 feet until the start of your next turn.
    higher_level: >-
      When you cast this spell using a spell slot of 4th level or higher, the damage increases by 1d8 for every two slot
      levels above 3rd.
    range: Self
    concentration: true
    damageType: radiant
    dice: 1d8
  - name: Summon Aberration
    level: 4
    school: Conjuration
    casting_time: 1 action
    duration: Up to 1 hour
    components: V, S, M
    desc: >-
      You call forth an aberrant spirit. It manifests in an unoccupied space that you can see within range. This
      corporeal form uses the Aberrant Spirit stat block. When you cast the spell, choose Beholderkin, Slaad, or Star
      Spawn. The creature resembles an aberration of that kind, which determines certain traits in its stat block. The
      creature disappears when it drops to 0 hit points or when the spell ends.


      The creature is an ally to you and your companions. In combat, the creature shares your initiative count, but it
      takes its turn immediately after yours. It obeys your verbal commands (no action required by you). If you don't
      issue any, it takes the Dodge action and uses its move to avoid danger.
    higher_level: >-
      When you cast this spell using a spell slot of 5th level or higher, use the higher level wherever the spell's
      level appears in the stat block.
    material: A pickled tentacle and an eyeball in a platinum-inlaid vial worth at least 400 gp.
    range: 90 feet
    concentration: true
  - name: Summon Beast
    level: 2
    school: Conjuration
    casting_time: 1 action
    duration: Up to 1 hour
    components: V, S, M
    desc: >-
      You call forth a bestial spirit. It manifests in an unoccupied space that you can see within range. This corporeal
      form uses the Bestial Spirit stat block. When you cast the spell, choose an environment: Air, Land, or Water. The
      creature resembles an animal of your choice that is native to the chosen environment, which determines certain
      traits in its stat block. The creature disappears when it drops to 0 hit points or when the spell ends.


      The creature is an ally to you and your companions. In combat, the creature shares your initiative count, but it
      takes its turn immediately after yours. It obeys your verbal commands (no action required by you). If you don't
      issue any, it takes the Dodge action and uses its move to avoid danger.
    higher_level: >-
      When you cast this spell using a spell slot of 3rd level or higher, use the higher level wherever the spell's
      level appears in the stat block.
    material: A feather, tuft of fur, and fish tail inside a gilded acorn worth at least 200 gp.
    range: 90 feet
    concentration: true
  - name: Summon Celestial
    level: 5
    school: Conjuration
    casting_time: 1 action
    duration: Up to 1 hour
    components: V, S, M
    desc: >-
      You call forth a celestial spirit. It manifests in an angelic form in an unoccupied space that you can see within
      range. This corporeal form uses the Celestial Spirit stat block. When you cast the spell, choose Avenger or
      Defender. Your choice determines the creature's attack in its stat block. The creature disappears when it drops to
      0 hit points or when the spell ends.


      The creature is an ally to you and your companions. In combat, the creature shares your initiative count, but it
      takes its turn immediately after yours. It obeys your verbal commands (no action required by you). If you don't
      issue any, it takes the Dodge action and uses its move to avoid danger.
    higher_level: >-
      When you cast this spell using a spell slot of 6th level or higher, use the higher level wherever the spell's
      level appears in the stat block.
    material: A golden reliquary worth at least 500 gp.
    range: 90 feet
    concentration: true
  - name: Summon Construct
    level: 4
    school: Conjuration
    casting_time: 1 action
    duration: Up to 1 hour
    components: V, S, M
    desc: >-
      You call forth the spirit of a construct. It manifests in an unoccupied space that you can see within range. This
      corporeal form uses the Construct Spirit stat block. When you cast the spell, choose a material: Clay, Metal, or
