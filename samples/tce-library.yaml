    higher_level: >-
      When you cast this spell using a spell slot of 4th level or higher, use the higher level wherever the spell's
      level appears in the stat block.
    material: A gilded skull worth at least 300 gp.
    range: 90 feet
    concentration: true
  - name: Sword Burst
    level: 0
    school: Conjuration
    casting_time: 1 action
    duration: Instantaneous
    components: V
    desc: >-
      You create a momentary circle of spectral blades that sweep around you. All other creatures within 5 feet of you
      must succeed on a dexterity saving throw or take 1d6 force damage.


      This spell's damage increases by 1d6 when you reach 5th level (2d6), 11th level (3d6), and 17th level (4d6).
    range: Self (5-foot radius)
    areaOfEffect: 5ft sphere
    damageType: force
    dice: 1d6
    saveStat: dex
    saveOnSuccess: none
  - name: Tasha's Caustic Brew
    level: 1
    school: Evocation
    casting_time: 1 action
    duration: Up to 1 minute
    components: V, S, M
    desc: >-
      A stream of acid emanates from you in a line 30 feet long and 5 feet wide in a direction you choose. Each creature
      in the line must succeed on a dexterity saving throw or be covered in acid for the spell's duration or until a
      creature uses its action to scrape or wash the acid off itself or another creature. A creature covered in the acid
      takes 2d4 acid damage at start of each of its turns.
    higher_level: >-
      When you cast this spell using a spell slot of 2nd level or higher, the damage increases by 2d4 for each slot
      level above 1st.
    material: A bit of rotten food.
    range: Self (30-foot line)
    areaOfEffect: 30ft line
    concentration: true
    damageType: acid
    dice: 2d4
    saveStat: dex
    saveOnSuccess: none
  - name: Tasha's Mind Whip
    level: 2
    school: Enchantment
    casting_time: 1 action
    duration: 1 round
    components: V
    desc: >-
      You psychically lash out at one creature you can see within range. The target must make an intelligence saving
      throw. On a failed save, the target takes 3d6 psychic damage, and it can't take a reaction until the end of its
      next turn. Moreover, on its next turn, it must choose whether it gets a move, an action, or a bonus action; it
      gets only one of the three. On a successful save, the target takes half as much damage and suffers none of the
      spell's other effects.
    higher_level: >-
      When you cast this spell using a spell slot of 3rd level or higher, you can target one additional creature for
      each slot level above 2nd. The creatures must be within 30 feet of each other when you target them.
    range: 90 feet
    damageType: psychic
    dice: 3d6
    saveStat: int
    saveOnSuccess: half
  - name: Tasha's Otherworldly Guise
    level: 6
    school: Transmutation
    casting_time: 1 bonus action
    duration: Up to 1 minute
    components: V, S, M
    desc: >-
      Uttering an incantation, you draw on the magic of the Lower Planes or Upper Planes (your choice) to transform
      yourself. You gain the following benefits until the spell ends:


      - You are immune to fire and poison damage (Lower Planes) or radiant and necrotic damage (Upper Planes).


      - You are immune to the poisoned condition (Lower Planes) or the charmed condition (Upper Planes).


      - Spectral wings appear on your back, giving you a flying speed of 40 feet.


      - You have a +2 bonus to AC.


      - All your weapon attacks are magical, and when you make a weapon attack, you can use your spellcasting ability
      modifier, instead of Strength or Dexterity, for the attack and damage rolls.


      - You can attack twice, instead of once, when you take the Attack action on your turn. You ignore this benefit if
      you already have a feature, like Extra Attack, that lets you attack more than once when you take the Attack action
      on your turn.
    material: An object engraved with a symbol of the Outer Planes, worth at least 500 gp.
    range: Self
    concentration: true
